name: tests

# The single source of truth for "did tests pass". Runs standalone on pushes
# and PRs; on a release it runs as the gating job inside release-artifacts.yml
# (workflow_call), so there's no standalone `release` trigger here -- that would
# just duplicate the same run.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call: {}

# Least privilege: this workflow only lints + tests, it never writes to the repo
# or a release. The release workflow that calls this one declares its own
# contents: write where it actually needs it.
permissions:
  contents: read

jobs:
  test:
    # push always runs. PRs run only when the author is an org
    # member/maintainer, so unreviewed or fork code never runs with this
    # workflow's token. workflow_call passes through: the calling release
    # workflow only fires on trusted events.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04-arm
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags so setuptools-scm can derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install package and test dependencies
        run: pip install --isolated -e . -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest --cov-fail-under=90
